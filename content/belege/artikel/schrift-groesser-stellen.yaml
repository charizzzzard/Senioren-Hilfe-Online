    zitat: "Sie können die Bildschirminhalte Ihres Android-Geräts heranzoomen, um sie sich größer anzeigen zu lassen."
  - aussage: "Einstellungen › Bedienungshilfen › Vergrößerung"
    quelle: https://support.google.com/accessibility/android/answer/6006949?hl=de
    zitat: "Tippen Sie auf Bedienungshilfen Vergrößerung."
