  # ---------------------------------------------------------------- iPhone: Bedienungshilfen
  - aussage: "Einstellungen › Bedienungshilfen › Anzeige & Textgröße"
    quelle: https://support.apple.com/de-de/guide/iphone/iph3c076905a/ios
