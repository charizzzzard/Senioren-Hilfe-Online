  - aussage: "„Fetter Text“ einschalten"
    quelle: https://support.apple.com/de-de/guide/iphone/iph3c076905a/ios
    zitat: "Text fetter machen: Aktiviere die Option „Fetter Text“."
  - aussage: "Kontrollzentrum: Regler „Textgröße“"
    quelle: https://support.apple.com/de-de/guide/iphone/iph3c076905a/ios
    zitat: "Öffne das Kontrollzentrum und passe den Schieberegler „Textgröße“ an."
  - aussage: "Fehlt der Regler: Taste „Hinzufügen“ oben links › „Steuerelement hinzufügen“ › „Textgröße“"
