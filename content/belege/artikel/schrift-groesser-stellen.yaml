  # ---------------------------------------------------------------- iPhone: Textgröße
  - aussage: "iPhone (iOS 27): Einstellungen › Erscheinungsbild › Textgröße"
    quelle: https://support.apple.com/de-de/guide/iphone/iphd6804774e/27.0/ios/27.0
    zitat: "Tippe auf „Erscheinungsbild“ und tippe dann auf „Textgröße“."
  - aussage: "iPhone (iOS 26 und älter): Einstellungen › Anzeige & Helligkeit › Textgröße"
    quelle: https://support.apple.com/de-de/guide/iphone/iphd6804774e/26.0/ios/26.0
    zitat: "Tippe auf „Anzeige & Helligkeit“ und tippe dann auf „Textgröße“."
  - aussage: "Regler verschieben, bis die Schrift gut lesbar ist (Richtung nicht festgelegt)"
    quelle: https://support.apple.com/de-de/guide/iphone/iphd6804774e/27.0/ios/27.0
    zitat: "Ziehe den Regler nach links oder rechts, um die Textgröße zu ändern."
  - aussage: "Die Größe gilt in Apps, die das unterstützen, z. B. Nachrichten, Mail, Kalender, Notizen"
    quelle: https://support.apple.com/de-de/guide/iphone/iph3c076905a/ios
    zitat: "Du kannst eine bevorzugte Textgröße für alle unterstützten Apps (darunter „Kalender“, „Mail“, „Nachrichten“, „Notizen“, „Einstellungen“ und mehr) festlegen."
  - aussage: "… auch in Kontakte"
    quelle: https://support.apple.com/de-de/102453
    zitat: "Du kannst die Schriftgröße in Mail, Kontakte, Kalender, Telefon, Notizen und anderen Apps ändern, die dynamischen Text unterstützen."
  - aussage: "Zurückstellen jederzeit möglich (iPhone)"
    quelle: https://support.apple.com/de-de/102453
