  # ---------------------------------------------------------------- Einschalten, vom Android-Handy
  - aussage: "Neues Gerät einschalten"
    quelle: https://support.google.com/android/answer/6193424?hl=de
    zitat: "Schalte das neue Gerät ein."
  - aussage: "Schritte können je nach Gerät variieren"
    quelle: https://support.google.com/android/answer/6193424?hl=de
    zitat: "Einige dieser Schritte können je nach Gerät variieren."
  - aussage: "Bei der Frage nach einem anderen Gerät „Android-Gerät“ wählen"
    quelle: https://support.google.com/android/answer/6193424?hl=de
    zitat: "Wenn Sie gefragt werden, ob Sie ein anderes Gerät für die Einrichtung nutzen möchten, wählen Sie Android-Gerät aus."
  - aussage: "QR-Code scannen, Geräte koppeln"
    quelle: https://support.google.com/android/answer/6193424?hl=de
    zitat: "Folgen Sie der Anleitung, um den QR‑Code zu scannen und die Geräte zu koppeln."
  - aussage: "PIN, Muster oder Passwort eingeben; WLAN-Zugänge und Google-Konto werden übertragen"
    quelle: https://support.google.com/android/answer/6193424?hl=de
