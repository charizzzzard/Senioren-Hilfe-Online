  - aussage: "Bis zu 15 GB kostenlos"
    quelle: https://support.google.com/android/answer/2819582?hl=de
    zitat: "Sie können bis zu 15 GB Speicherplatz für Ihr Google-Konto kostenlos sichern."
  - aussage: "Sicherung kann bis zu 24 Stunden dauern; danach steht „An“"
    quelle: https://support.google.com/android/answer/2819582?hl=de
