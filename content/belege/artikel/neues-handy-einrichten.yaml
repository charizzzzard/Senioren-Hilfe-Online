  - aussage: "Höhere Android-Version lässt sich nicht auf niedrigerer wiederherstellen"
    quelle: https://support.google.com/android/answer/2819582?hl=de
    zitat: "Ein Back-up, das auf einem Smartphone mit einer höheren Android-Version erstellt wurde, kann nicht auf einem Smartphone mit einer niedrigeren Android-Version wiederhergestellt werden."
  - aussage: "Manche Schritte erst ab Android 9"
    quelle: https://support.google.com/android/answer/2819582?hl=de
