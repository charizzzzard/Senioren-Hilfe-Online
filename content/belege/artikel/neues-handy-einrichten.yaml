    quelle: https://support.google.com/android/answer/2819582?hl=de
    zitat: "Apps und App-Daten Anrufliste Kontakte Geräteeinstellungen SMS und MMS"
  - aussage: "Einstellungen öffnen"
    quelle: https://support.google.com/android/answer/2819582?hl=de
    zitat: "Öffnen Sie auf Ihrem Android-Gerät die Einstellungen."
  - aussage: "Auf „Google“ tippen, dann „Alle Dienste“"
    quelle: https://support.google.com/android/answer/2819582?hl=de
    zitat: "Tippen Sie auf Google Alle Dienste."
