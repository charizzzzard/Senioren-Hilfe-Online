  - aussage: "Echte Nachricht: antippen, dann „Als bekannt markieren“"
    quelle: https://support.apple.com/de-de/guide/iphone/iph203ab0be4/27.0/ios/27.0
    zitat: "tippe dann auf „Als bekannt markieren“."
