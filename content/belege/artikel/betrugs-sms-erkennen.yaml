  - aussage: "iOS 26: „Filtern verwalten“"
    quelle: https://support.apple.com/de-de/guide/iphone/iph203ab0be4/26.0/ios/26.0
    zitat: "Tippe oben rechts in der Konversationsliste auf die Taste „Filtern“ und tippe dann auf „Filtern verwalten“."
  - aussage: "„Unbekannte Absender:innen überprüfen“ einschalten (iOS 27)"
    quelle: https://support.apple.com/de-de/guide/iphone/iph203ab0be4/27.0/ios/27.0
    zitat: "Aktiviere die Option „Unbekannte Absender:innen überprüfen“."
  - aussage: "… heißt in iOS 26 genauso"
    quelle: https://support.apple.com/de-de/guide/iphone/iph203ab0be4/26.0/ios/26.0
