  # ---------------------------------------------------------------- Android (Google Messages)
  - aussage: "Finger auf die Unterhaltung halten"
    quelle: https://support.google.com/messages/answer/7029021?hl=de&co=GENIE.Platform%3DAndroid
    zitat: "Halten Sie auf dem Startbildschirm die Unterhaltung gedrückt, die Sie blockieren möchten."
  - aussage: "„Blockieren“, dann „OK“"
    quelle: https://support.google.com/messages/answer/7029021?hl=de&co=GENIE.Platform%3DAndroid
    zitat: "Tippen Sie auf „Blockieren“"
  - aussage: "Aufheben im Ordner „Als Spam markiert und blockiert“ (über Profilbild oder Dreipunkt-Menü)"
    quelle: https://support.google.com/messages/answer/7029021?hl=de&co=GENIE.Platform%3DAndroid
    zitat: "Als Spam markiert und blockiert."
  - aussage: "Kontakt auswählen"
    quelle: https://support.google.com/messages/answer/7029021?hl=de&co=GENIE.Platform%3DAndroid
    zitat: "Wählen Sie den Kontakt aus der Liste aus."
  - aussage: "„Blockierung aufheben“"
    quelle: https://support.google.com/messages/answer/7029021?hl=de&co=GENIE.Platform%3DAndroid
    zitat: "Tippen Sie auf Blockierung aufheben."
  - aussage: "Spamschutz ist von Anfang an eingeschaltet"
    quelle: https://support.google.com/messages/answer/9327903?hl=de
    zitat: "Der Spamschutz ist im Standardschutzmodus aktiviert."
  - aussage: "Rechts oben auf das Profilbild tippen"
    quelle: https://support.google.com/messages/answer/9327903?hl=de
    zitat: "Tippe rechts oben auf dein Profilbild oder deine Initiale."
  - aussage: "Einstellungen für Messages › Sicherheit und Datenschutz › Schutz vor Spam und Betrug; nur sichtbar, wenn verfügbar"
    quelle: https://support.google.com/messages/answer/9327903?hl=de
    zitat: "Die Funktion „Schutz vor Spam und Betrug“ wird nur dann angezeigt, wenn sie auf deinem Gerät verfügbar ist."
  # ---------------------------------------------------------------- Vorbeugen
  - aussage: "Spam-Filter können die Zahl solcher SMS verringern"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Manche Smartphones oder Sicherheits-Apps bieten Spam-Filter. Sie können helfen, die Zahl solcher SMS zu verringern."
  - aussage: "Handynummer sparsam weitergeben"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Geben Sie Ihre Handynummer nur an, wenn es zwingend nötig ist."
  - aussage: "Updates installieren"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Halten Sie Betriebssysteme, Apps und Virenschutz durch Updates immer auf dem aktuellen Stand."
  - aussage: "Drittanbietersperre beim Mobilfunkanbieter aktivieren"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "sollten Sie bei Ihrem Mobilfunkanbieter eine Drittanbietersperre aktivieren"
  - aussage: "Über Drittanbieter können unbemerkt teure Abos abgeschlossen werden"
    quelle: https://www.bundesnetzagentur.de/DE/Vportal/TK/Aerger/Faelle/SMSSpam/start.html
    zitat: "Abschluss von hochpreisigen Abonnements über Drittanbieter möglich"
  - aussage: "Android: keine Apps aus unbekannten Quellen"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "deaktivieren Sie die Möglichkeit, dass Apps aus unbekannten Quellen installiert werden dürfen"
