# Belegtabelle für content/artikel/betrugs-sms-erkennen.md (Format: docs/BETRIEB.md, Abschnitt „Belegtabelle“)
# Jede Aussage mit einem wörtlichen Zitat aus einer selbst gelesenen Quelle. Prüfen: python tools/belegcheck.py betrugs-sms-erkennen
geprueft: 2026-11-10
belege:
  # ---------------------------------------------------------------- Die Masche
  - aussage: "Sehr viele Menschen bekommen SMS angeblicher Paketdienste"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Viele Handynutzer:innen werden von SMS belästigt, die angeblich von Paketdiensten stammen."
  - aussage: "Die Verbraucherzentralen warnen vor diesen SMS"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Die Verbraucherzentralen warnen vor SMS von angeblichen Paketdiensten, in denen Empfänger auf einen Link tippen sollen."
  - aussage: "„Smishing“: Kunstwort aus SMS und Phishing"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Diese Betrugsform wird in der Fachwelt als \"Smishing\" bezeichnet: Die Kombination der Begriffe SMS und Phishing."
  - aussage: "Die SMS enthält jedes Mal einen Link auf eine fremde Internetseite"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Enthalten ist jedes Mal ein Link auf seltsame Internetseiten."
  - aussage: "Die Seite sieht oft aus wie die eines bekannten Unternehmens"
    quelle: https://www.bundesnetzagentur.de/DE/Vportal/TK/Aerger/Faelle/SMSSpam/start.html
    zitat: "Häufig wird auf den Seiten die Corporate Identity von bekannten Unternehmen, wie Banken, Sparkassen oder Paketzustellern, genutzt"
  - aussage: "Folgen: schädliche Apps, Massen-SMS, Abofallen"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Die Folge können schädliche Apps, Massen-SMS und Abofallen sein."
  - aussage: "Das Handy verschickt danach selbst Massen-SMS"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "schädliche Apps zu verbreiten, die Daten auslesen und massenweise SMS an gespeicherte Kontakte senden"
  - aussage: "Angebliche Gebühren; Betrüger erbeuten Kreditkartendaten"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Die Kriminellen erhalten somit Ihre Kreditkartendaten."
  - aussage: "… oder andere persönliche Daten"
    quelle: https://www.bundesnetzagentur.de/DE/Vportal/TK/Aerger/Faelle/SMSSpam/start.html
    zitat: "Auf den beworbenen Internetseiten wird zur Eingabe von persönlichen Daten, insbesondere auch Kreditkartendaten aufgefordert."
  # ---------------------------------------------------------------- Erkennen
  - aussage: "Merkmal: angebliche Zollgebühren"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Mal sollen angeblich Zollgebühren bezahlt werden, mal fehlen angeblich Informationen für die Zustellung."
  - aussage: "Merkmal: Zeitdruck („läuft in Kürze ab“ – Beispiel der Bundesnetzagentur)"
    quelle: https://www.bundesnetzagentur.de/DE/Vportal/TK/Aerger/Faelle/SMSSpam/start.html
    zitat: "Ihre Registrierung für die Banking-to-go-App läuft in Kürze ab."
  - aussage: "Zollgebühren zahlt man nicht vorab über eine Internetseite"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Das heißt, eventuelle Zollgebühren sind nicht vor der Zustellung eines Pakets über eine Internetseite zu bezahlen."
  - aussage: "Ausnahme: Bezahl-Service mancher Paketdienste, nur nach eigener Anmeldung"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Es gibt Paketdienste, die das Bezahlen vor der Zustellung als Service anbieten. Dafür müssen Sie sich aber vorher registrieren"
  - aussage: "Dann stehen immer Sendungsnummer und Name des Absenders in der Nachricht"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "In diesen Nachrichten befinden sich dann immer eine Sendungsnummer und der Name des Absenders."
  - aussage: "Über Links in SMS keine persönlichen Daten angeben"
    quelle: https://www.bundesnetzagentur.de/DE/Vportal/TK/Aerger/Faelle/SMSSpam/start.html
    zitat: "Geben Sie keine persönlichen Daten über Links in SMS oder E-Mails an, es sei denn, Sie haben den Absender verifiziert."
  # ---------------------------------------------------------------- Richtig reagieren
  - aussage: "Nicht auf den Link tippen"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Öffnen Sie keinen Link aus SMS unbekannter Herkunft!"
  - aussage: "Nicht antworten, löschen – jede Antwort zeigt, dass die Nummer benutzt wird"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Antworten Sie nicht auf die SMS, sondern löschen Sie sie! Jede andere Reaktion zeigt, dass die Handynummer aktiv genutzt wird."
  - aussage: "Absender sperren möglich, aber die Nummern wechseln ständig"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Doch das schützt nicht vor weiteren ähnlichen Nachrichten, denn die Nummern wechseln ständig."
  - aussage: "Paket erwartet: Seite des Paketdienstes selbst öffnen, Sendungsnummer eingeben"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "öffnen Sie die Internetseite des Paketdienstes in einem Browser und geben Sie dort die Sendungsnummer ein, um den Status zu prüfen"
  # ---------------------------------------------------------------- Melden
  - aussage: "Bundesnetzagentur: Link „Direkt zum Beschwerdeformular“"
    quelle: https://www.bundesnetzagentur.de/DE/Vportal/TK/Aerger/Faelle/SMSSpam/start.html
    zitat: "Beschwerde Direkt zum Beschwerdeformular"
  - aussage: "Behörde kann mit den Hinweisen vorgehen, zum Beispiel Rufnummern abschalten lassen"
    quelle: https://www.bundesnetzagentur.de/DE/Vportal/TK/Aerger/Faelle/SMSSpam/start.html
    zitat: "Anordnung der Abschaltung von Rufnummern, so dass die Rufnummer technisch nicht mehr erreichbar ist"
  # ---------------------------------------------------------------- Schon getippt
  - aussage: "Keine Installation einer neuen App erlauben"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Haben Sie den Link in der Nachricht angetippt, erlauben Sie keine Installation einer neuen App!"
  - aussage: "App installiert: Flugmodus, damit die App keine Daten mehr sendet"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Schalten Sie Ihr Smartphone in den Flugmodus, damit die schädliche App keine weiteren Daten über das Internet senden kann."
  - aussage: "Im Flugmodus ist das Mobilfunknetz aus"
    quelle: https://support.apple.com/de-de/108785
    zitat: "Mit dem Flugmodus kannst du die Mobilfunk- und WLAN-Funktionen deines Geräts während eines Flugs deaktivieren."
  - aussage: "WLAN kann im Flugmodus an bleiben – deshalb prüfen"
    quelle: https://support.google.com/pixelphone/answer/2819583?hl=de
    zitat: "Wenn Sie das nächste Mal den Flugmodus aktivieren, bleiben WLAN und Bluetooth aktiviert."
  - aussage: "Bildschirmfotos als Beweis, Anzeige bei der Polizei"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Sammeln Sie Beweise (z.B. durch Erstellen von Bildschirmfotos) und erstatten Sie Anzeige bei der Polizei"
  - aussage: "Mobilfunkanbieter informieren, Nachweis über verschickte SMS"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Informieren Sie Ihren Mobilfunkanbieter und lassen Sie sich einen Kostennachweis über möglicherweise verschickte SMS erstellen."
  - aussage: "Im schlimmsten Fall Zurücksetzen auf den Werkszustand"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Im schlimmsten Fall hilft nur ein Zurücksetzen des Geräts in den Auslieferungszustand."
  - aussage: "Bezahlt: Bank informieren, Abbuchungen beobachten"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Beobachten Sie die Abbuchungen von Ihrer Kreditkarte genau und informieren Sie vorsorglich Ihre Bank."
  - aussage: "Im Zweifel Karte sperren lassen"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Im Zweifel lassen Sie die Kreditkarte sperren und beantragen Sie eine neue."
  - aussage: "Sperr-Notruf 116 116 sperrt Karten"
    quelle: https://www.sperr-notruf.de/
    zitat: "Mit einem Anruf unter 116 116 sperrst Du Deine Karten sofort"
  - aussage: "Charge-Back-Verfahren über die Bank"
    quelle: https://www.verbraucherzentrale.de/wissen/digitale-welt/mobilfunk-und-festnetz/paketdienstsms-vorsicht-abzocke-58988
    zitat: "Eventuell können Sie das gezahlte Geld über ein \"Charge-Back-Verfahren\" zurückholen. Setzen Sie sich dazu mit Ihrer Bank in Verbindung."
