  # ---------------------------------------------------------------- Meldung 3: Microsoft
  - aussage: "Störung von Microsoft 365 (Teams, Outlook) am 12. und 13. November"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "Am 12. und 13. November 2026 waren weltweit Programme aus Microsoft 365 wie Teams und Outlook gestört."
  - aussage: "Microsoft warnt vor Phishing-Mails, die das Problem aufgreifen"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "Jetzt warnt Microsoft vor betrügerischen E-Mails, die das Problem aufgreifen."
  - aussage: "Bericht der Verbraucherzentrale mit Stand 18. November"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "Stand: 18. November 2026"
  - aussage: "Mails: einige E-Mails nicht zugestellt, Button klicken, sonst nach 24 Stunden gelöscht"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "In den Phishing-Mails heißt es, dass durch die Störung einige E-Mails nicht zugestellt werden konnten. Empfänger:innen sollen auf einen Button klicken, um die Nachrichten abzurufen, da sie andernfalls nach 24 Stunden gelöscht würden."
  - aussage: "Mails enthalten Microsoft-Logo und richtige Fallnummer"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "Denn die Phishing-Mails enthalten das Microsoft-Logo und die richtige Fallnummer"
  - aussage: "Nicht auf Inhalt und Aussehen verlassen"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "verlassen Sie sich nicht nur auf den Inhalt und deren Aussehen!"
  - aussage: "Absender: hinter dem @ „microsoft“, Schreibweise „rnicrosoft“ nicht echt"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "Bei einer echten E-Mail von Microsoft sollte hinter dem @ auch der Begriff \"microsoft\" auftauchen. Achten Sie dabei auf die Schreibweise: \"rnicrosoft\" zum Beispiel sieht ähnlich aus, ist aber nicht echt!"
  - aussage: "Link prüfen: Mauszeiger auf den Link zeigt die Internetadresse"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "Halten Sie den Mauszeiger auf einen Link oder Button, zeigt Ihr E-Mail-Programm die URL (Internetadresse) an, zu der der Link führt."
  - aussage: "Nutzerkonto im Browser oder in der App des Anbieters öffnen"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "Sind Sie durch eine E-Mail verunsichert, öffnen Sie ihr Nutzerkonto in einem Browser oder in der App des Anbieters."
  - aussage: "Auch Anrufe eines angeblichen Microsoft-Supports möglich"
    quelle: https://www.verbraucherzentrale.de/warnungen/microsoft-warnt-nach-outlookstoerung-vor-phishingkampagne-127229
    zitat: "Auch weitere Betrugsversuche, zum Beispiel durch Anrufe eines angeblichen Microsoft-Supports, sind möglich."
  - aussage: "Polizei: Seriöse Unternehmen wie Microsoft melden sich nicht unaufgefordert; auflegen"
    quelle: https://www.polizei-beratung.de/themen-und-tipps/betrug/falsche-microsoft-mitarbeiter/
    zitat: "Seriöse Unternehmen wie Microsoft nehmen nicht unaufgefordert Kontakt zu ihren Kunden auf. Sollte sich ein Servicemitarbeiter bei Ihnen melden, ohne dass Sie darum gebeten haben: Legen Sie einfach den Hörer auf."
  - aussage: "Polizei: unbekanntem Anrufer nie Zugriff auf den Rechner gewähren"
    quelle: https://www.polizei-beratung.de/themen-und-tipps/betrug/falsche-microsoft-mitarbeiter/
    zitat: "Gewähren Sie einem unbekannten Anrufer niemals Zugriff auf Ihren Rechner"
  # ---------------------------------------------------------------- Meldung 4: Polizei, Taschendiebstahl, 116 116
  - aussage: "Polizei-Tipps vom 18.11.2026: Taschendiebstahl auf Herbst- und Weihnachtsmärkten"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Was tun bei Verlust oder Diebstahl von Debitkarten? 18.11.2026"
  - aussage: "Herbst- und Weihnachtsmärkte bieten Taschendieben viele Gelegenheiten"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
