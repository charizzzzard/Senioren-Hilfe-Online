  - aussage: "Ablenkung: anrempeln, Kleidung beschmutzen, nach dem Weg fragen; Komplize stiehlt"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Im Gedränge werden Opfer angerempelt oder unter einem Vorwand abgelenkt, beispielsweise, indem ihre Kleidung „versehentlich“ beschmutzt wird oder die Täter nach dem Weg fragen. Während einer das Opfer ablenkt, stiehlt eine Komplizin oder ein Komplize den Geldbeutel oder andere Wertsachen."
  - aussage: "Tipp: Abstand einfordern"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Fordern Sie Abstand ein, wenn Ihnen Fremde zu nahe kommen."
  - aussage: "Tipp: nur so viel Bargeld wie nötig"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Nehmen Sie nur so viel Bargeld mit wie nötig."
  - aussage: "Tipp: Geld, Karten, Papiere, Smartphone in verschiedenen verschlossenen Innentaschen nah am Körper"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Tragen Sie Geld, Zahlungskarten und Papiere sowie Ihr Smartphone immer in verschiedenen verschlossenen Innentaschen der Kleidung möglichst nah am Körper."
  - aussage: "Tipp: Taschen verschlossen vorne tragen oder unter den Arm klemmen"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Tragen Sie Hand- und Umhängetaschen verschlossen auf der Körpervorderseite oder klemmen Sie sich diese unter den Arm."
  - aussage: "Sofort unter 116 116 sperren"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "sperren Sie umgehend unter 116 116"
  - aussage: "116 116 für alle girocards und die meisten Kreditkarten"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Über den Sperr-Notruf 116 116* ist das für alle girocards und die meisten Kreditkarten möglich."
  - aussage: "Auch elektronischer Personalausweis und SIM-Karte sperrbar"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Hier können Sie im Verlustfall u.a. auch Ihren elektronischen Personalausweis oder Ihre SIM-Karte sperren lassen."
  - aussage: "Aus Deutschland kostenfrei"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Sperr-Notruf 116 116 aus Deutschland kostenfrei."
  - aussage: "Anzeige bei der Polizei; sie kann Lastschrift per Unterschrift sperren lassen"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Zeigen Sie einen Diebstahl auch bei der Polizei an. Diese kann zusätzlich die Sperrung des elektronischen Lastschriftverfahrens per Unterschrift (SEPA-Lastschriften) veranlassen."
  - aussage: "Kontobewegungen prüfen, unberechtigte Abbuchungen bei Bank oder Sparkasse reklamieren"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "Prüfen Sie sorgfältig Ihre Kontobewegungen und reklamieren Sie unberechtigte Abbuchungen bei Ihrer Bank oder Sparkasse."
  - aussage: "Kostenlose SperrApp für Android und iOS, Daten verschlüsselt hinterlegen"
    quelle: https://www.polizei-beratung.de/aktuelles/detailansicht/was-tun-bei-verlust-oder-diebstahl-von-debitkarten/
    zitat: "bietet der Sperr-Notruf eine kostenlose SperrApp für Android und iOS an. In der App können alle Daten zu sperrbaren Karten und Ausweisen für den Ernstfall verschlüsselt hinterlegt werden."
