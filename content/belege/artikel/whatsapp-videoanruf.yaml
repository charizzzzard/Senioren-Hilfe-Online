    zitat: "Videoanrufe beginnen standardmäßig mit der Frontkamera."
  - aussage: "Android: Videoanrufe beginnen mit der Frontkamera"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=android
    zitat: "Videoanrufe beginnen standardmäßig mit der Frontkamera."
  # ---------------------------------------------------------------- iPhone: starten
  - aussage: "iPhone: Chat mit der Person öffnen"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Öffne einen Einzelchat mit dem Kontakt, den du anrufen möchtest."
  - aussage: "iPhone: auf das Symbol mit der Videokamera tippen"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Tippe auf Videoanruf (Videokamera)."
  - aussage: "iPhone mit iOS 18: Videokamera oben rechts im Chat, links daneben das Symbol für einen Sprachanruf"
    geraetetest: "iPhone, iOS 18.7.8, 13.11.2026 (Betreiber)"
  - aussage: "iPhone, andere Möglichkeit: Bereich „Anrufe“, Symbol für neuen Anruf, Person suchen, Videokamera"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Alternativ kannst du WhatsApp öffnen und den Anrufe-Tab aufrufen. Tippe dann auf Gruppenanruf oder Neuer Anruf (Telefon mit Pluszeichen). Suche nach dem Kontakt, mit dem du einen Videoanruf starten möchtest, und tippe dann auf Videoanruf (Videokamera)."
  # ---------------------------------------------------------------- iPhone: annehmen
  - aussage: "iPhone gesperrt: Mitteilung „Eingehender Videoanruf“"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Wenn dein Telefon gesperrt ist und du einen Videoanruf erhältst, wird dir die Mitteilung Eingehender Videoanruf"
  - aussage: "iPhone gesperrt: auf der Mitteilung wischen, um anzunehmen"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Wische auf der Benachrichtigung, um den Anruf anzunehmen."
  - aussage: "iPhone entsperrt: Mitteilung nach unten ziehen und „Annehmen“ tippen – oder direkt auf die Mitteilung tippen"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Du kannst die Benachrichtigung nach unten ziehen und dann auf Annehmen tippen oder auf die Benachrichtigung tippen, um den Anruf anzunehmen."
  - aussage: "iPhone: Mitteilung nach unten ziehen, „Nachricht“ – mit kurzer Nachricht ablehnen"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Ziehe die Benachrichtigung nach unten und tippe auf Nachricht, um den Anruf mit einer kurzen Nachricht abzulehnen."
  # ---------------------------------------------------------------- iPhone: auflegen (Gerätetest vom 05.11.2026, Feld getestet)
  - aussage: "iPhone: einmal auf den Bildschirm tippen, dann erscheinen die Knöpfe; unten in der Mitte der rote runde Knopf mit dem Telefonhörer"
    geraetetest: "iPhone, iOS 18, 05.11.2026 (Betreiber)"
  - aussage: "iPhone: Gespräch ist sofort beendet, keine Rückfrage; nach eigenem Anruf wieder im Chat, nach angenommenem Anruf dort, wo man vorher war"
    geraetetest: "iPhone, iOS 18, 05.11.2026 (Betreiber)"
