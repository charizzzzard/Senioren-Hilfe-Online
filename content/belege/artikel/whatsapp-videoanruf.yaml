  # ---------------------------------------------------------------- Android: annehmen
  - aussage: "Android gesperrt: Es öffnet sich ein Bildschirm für den Videoanruf"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=android
    zitat: "Wenn dein Telefon gesperrt ist und du einen Anruf erhältst, öffnet sich der Bildschirm WhatsApp-Videoanruf."
  - aussage: "Android gesperrt: weiße Videokamera im blauen Kreis nach oben wischen"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=android
    zitat: "Zum Annehmen nach oben wischen (weiße Videokamera in blauem Kreis) zum Annehmen nach oben."
  - aussage: "Android entsperrt: kleines Fenster „Eingehender Videoanruf“, auf „Video“ tippen"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=android
    zitat: "Wenn dein Telefon entsperrt ist und du einen Videoanruf erhältst, öffnet sich das Pop-up Eingehender Videoanruf. Hier kannst du auf Ablehnen oder Video tippen."
  - aussage: "Android: manchmal „Video deaktivieren“ – annehmen, ohne dass man Sie sieht"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=android
    zitat: "Wenn die Möglichkeit angeboten wird, kannst du auf Video deaktivieren tippen, um den Anruf ohne Video anzunehmen."
  # ---------------------------------------------------------------- Hat es geklappt / Während des Gesprächs
  - aussage: "WhatsApp zeigt das eigene Kamerabild; die andere Person sieht diese Übertragung"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Du kannst deine eigene Videokachel verbergen, um mehr Platz auf dem Bildschirm zu haben. Dadurch wird deine eigene Videoübertragung nicht für andere ausgeschaltet."
  - aussage: "iPhone mit iOS 18: andere Person im Vollbild, eigenes Bild klein oben rechts und verschiebbar; Antippen tauscht die Bilder"
    geraetetest: "iPhone, iOS 18.7.8, 13.11.2026 (Betreiber)"
  - aussage: "iPhone: Symbol „Kamera wechseln“ mit zwei gebogenen Pfeilen wechselt zwischen Front- und Rückkamera (hin und zurück)"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Um während eines Videoanrufs zwischen der Front- und Rückkamera deines Geräts zu wechseln, tippe auf Kamera wechseln (Kamera mit zwei gebogenen Pfeilen in einem Kreis)."
  - aussage: "Android: Symbol „Kamera wechseln“ mit zwei gebogenen Pfeilen"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=android
    zitat: "tippe auf Kamera wechseln (zwei um einen weißen Punkt gebogene weiße Pfeile in einem Kreis)."
  - aussage: "Bild ausschalten: durchgestrichene Videokamera"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=iphone
    zitat: "Tippe auf Kamera aus (durchgestrichene Videokamera), um dein Video während des Anrufs auszuschalten."
  - aussage: "Android: Bild ausschalten mit der durchgestrichenen Videokamera"
    quelle: https://faq.whatsapp.com/1862285217468140/?locale=de_DE&cms_platform=android
    zitat: "Tippe auf Kamera aus (durchgestrichene Videokamera), um dein Video während des Anrufs auszuschalten."
