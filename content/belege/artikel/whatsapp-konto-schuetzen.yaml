  # ---------------------------------------------------------------- Verknüpfte Geräte
  - aussage: "WhatsApp empfiehlt, verknüpfte Geräte regelmäßig zu prüfen"
    quelle: https://faq.whatsapp.com/1428782138011916/?locale=de_DE&cms_platform=iphone
