  # ---------------------------------------------------------------- Der Code
  - aussage: "Beim Einrichten kommt ein sechsstelliger Code per SMS oder Anruf; er bestätigt, dass die Nummer Ihnen gehört"
    quelle: https://faq.whatsapp.com/506595211487528/?locale=de_DE
    zitat: "Um zu bestätigen, dass die Telefonnummer dir gehört, wirst du aufgefordert, einen sechsstelligen Registrierungscode einzugeben, den du per SMS oder Telefonanruf erhalten hast."
  - aussage: "Mit dem Code können Betrüger das Konto übernehmen"
    quelle: https://faq.whatsapp.com/479314433984258/?locale=de_DE
    zitat: "Wenn eine Person versucht, dein Konto zu übernehmen, braucht sie den SMS-Verifizierungscode, der an deine Telefonnummer gesendet wird."
  - aussage: "… und sich in Chats und Gruppen als Sie ausgeben"
    quelle: https://faq.whatsapp.com/1131652977717250/?locale=de_DE
    zitat: "da sich diese Person in Chats und Gruppen für dich ausgeben könnte"
  - aussage: "Code niemals teilen – nicht einmal mit Freunden oder der Familie"
    quelle: https://faq.whatsapp.com/1131652977717250/?locale=de_DE
    zitat: "Du solltest deinen Registrierungscode niemals mit anderen teilen, nicht einmal mit Freund*innen oder der Familie."
  - aussage: "Dasselbe gilt für das Passwort"
    quelle: https://faq.whatsapp.com/1095301557782068/?locale=de_DE&cms_platform=iphone
    zitat: "Teile niemals deinen Registrierungscode oder dein Passwort mit anderen."
  - aussage: "Verdächtige Nachricht von einem bekannten Kontakt: dessen Konto könnte übernommen sein"
    quelle: https://faq.whatsapp.com/2286952358121083/?locale=de_DE
    zitat: "Wenn du eine verdächtige Nachricht von einem bekannten Kontakt erhältst, könnte sein Konto gehackt worden sein."
  - aussage: "Code ohne Anforderung: Jemand hat Ihre Nummer eingegeben – Tippfehler oder Übernahmeversuch"
    quelle: https://faq.whatsapp.com/479314433984258/?locale=de_DE
    zitat: "Dies ist häufig der Fall, wenn ein*e andere*r Benutzer*in versehentlich deine Nummer statt der eigenen bei der Registrierung angibt. Dies kann auch der Fall sein, wenn jemand versucht, dein Konto zu übernehmen."
  - aussage: "Ohne den Code kommt die Person nicht weiter; Sie behalten die Kontrolle"
    quelle: https://faq.whatsapp.com/479314433984258/?locale=de_DE
    zitat: "Du behältst somit die Kontrolle über dein WhatsApp-Konto."
  # ---------------------------------------------------------------- Verifizierung in zwei Schritten
  - aussage: "Nach dem Code folgt bei eingeschalteter Funktion eine zweite Prüfung – zum Beispiel mit dem Passwort"
    quelle: https://faq.whatsapp.com/506595211487528/?locale=de_DE
    zitat: "Wenn du die Verifizierung in zwei Schritten aktivierst, kannst du deine Telefonnummer, ein Passwort oder deine E-Mail-Adresse für die zusätzliche Authentifizierung verwenden."
