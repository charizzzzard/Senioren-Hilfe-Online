  - aussage: "Freiwillig (man kann es aktivieren)"
    quelle: https://faq.whatsapp.com/490592613091019/?locale=de_DE&cms_platform=android
    zitat: "Du kannst die Ende-zu-Ende-Verschlüsselung für diese Backups aktivieren."
