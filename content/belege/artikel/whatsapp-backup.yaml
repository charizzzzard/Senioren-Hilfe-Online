    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=iphone
    zitat: "Verifiziere deine Telefonnummer und deine Apple-ID."
  - aussage: "iPhone: „Chatverlauf wiederherstellen“ antippen"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=iphone
    zitat: "Tippe auf Chatverlauf wiederherstellen."
  - aussage: "Erst Nachrichten; App geöffnet lassen, bis Chats angezeigt werden"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=iphone
