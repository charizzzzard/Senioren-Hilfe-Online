  - aussage: "Dieselbe Telefonnummer"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Die zum Wiederherstellen des Backups verwendete Telefonnummer muss die gleiche sein, die auch beim Erstellen des Backups verwendet wurde."
  - aussage: "iPhone: dieselbe Telefonnummer und dasselbe iCloud-Konto"
    quelle: https://faq.whatsapp.com/481135090640375/?locale=de_DE&cms_platform=iphone
