  - aussage: "Menüpunkt „Cloud-Backup“"
    quelle: https://faq.whatsapp.com/481135090640375/?locale=de_DE&cms_platform=android
    zitat: "Tippe auf Chats > Chat-Backup. Tippe auf Cloud-Backup."
  - aussage: "WhatsApp aktuell halten"
    quelle: https://faq.whatsapp.com/481135090640375/?locale=de_DE&cms_platform=android
    zitat: "empfehlen wir dir, WhatsApp auf deinem Gerät auf dem neuesten Stand zu halten"
  - aussage: "„Chat exportieren“ ist kein Backup, kann nicht wieder importiert werden"
    quelle: https://faq.whatsapp.com/1180414079177245/?locale=de_DE&cms_platform=iphone
    zitat: "Dein Chatverlauf kann nicht wieder importiert werden, da es sich um eine Text- und keine Backup-Datei handelt."
  - aussage: "WhatsApp kann Chats nicht für Sie wiederherstellen"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Wir können deine Chats, Kontakte oder Mediendateien nicht für dich wiederherstellen, übertragen oder löschen."
