  - aussage: "Kann eine Weile dauern"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=iphone
    zitat: "Die Wiederherstellung kann eine Weile dauern."
  - aussage: "Dabei WLAN und Strom"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=iphone
    zitat: "sollte dein iPhone mit einem WLAN verbunden und an eine Stromquelle angeschlossen sein."
  - aussage: "Nicht auf „Überspringen“ tippen, wenn man alte Chats behalten will"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Tippe nicht auf Überspringen, wenn du deine alten Chats behalten willst."
  - aussage: "Nach Überspringen wird das alte Backup beim nächsten Backup ersetzt, alter Verlauf nicht wiederherstellbar"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
