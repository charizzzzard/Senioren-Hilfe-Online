  # ---------------------------------------------------------------- Verschlüsselt
  - aussage: "Menüpunkt „Ende-zu-Ende-verschlüsseltes Backup“ unter Chat-Backup"
    quelle: https://faq.whatsapp.com/481135090640375/?locale=de_DE&cms_platform=iphone
