  # ---------------------------------------------------------------- Wenn es nicht klappt
  - aussage: "Backup iPhone ↔ Android nicht wiederherstellbar"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=iphone
    zitat: "Es ist derzeit nicht möglich, auf Android erstellte Backups auf deinem iPhone oder auf deinem iPhone erstellte Backups auf Android wiederherzustellen."
  - aussage: "Für den Wechsel gibt es eine eigene Übertragung"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Chats von einem iPhone auf ein Android-Gerät übertragen"
  - aussage: "Backup älter als 120 Tage evtl. nicht wiederherstellbar"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Wenn dein letztes Backup älter als 120 Tage ist, ist es unter Umständen nicht möglich, dein Backup wiederherzustellen"
  - aussage: "Videos nur, wenn beim Backup eingeschlossen"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Videos werden nur wiederhergestellt, wenn du die Option Inklusive Videos aktiviert hast, bevor du dein letztes Backup erstellt hast."
  - aussage: "Freier Speicher muss größer sein als das Backup, sonst teilweise"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Der freie Speicherplatz deines Telefons muss größer sein als das Backup, das du wiederherstellen möchtest. Wenn dein Telefon nicht genügend freien Speicherplatz aufweist, kann es zu einem teilweisen Backup kommen."
  - aussage: "Fehlende Chats: kein neues Backup erstellen"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Wenn du versuchst, bereits fehlende Chats wiederherzustellen, solltest du kein neues Backup erstellen."
  - aussage: "Neuer Speicher zeigt sich als „Cloud-Backup“ mit Auswahl WhatsApp"
    quelle: https://faq.whatsapp.com/481135090640375/?locale=de_DE&cms_platform=iphone
