  # ---------------------------------------------------------------- Wiederherstellen
  - aussage: "Neues Gerät / altes defekt: Chats mit Backup wiederherstellen"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
    zitat: "Wenn dein altes Telefon defekt oder verloren gegangen ist, kannst du deine Chats auf einem neuen Gerät mithilfe deines Backups wiederherstellen."
  - aussage: "WhatsApp installieren, beim Einrichten „Wiederherstellen“ antippen (Android)"
    quelle: https://faq.whatsapp.com/618575946635920/?locale=de_DE&cms_platform=android
