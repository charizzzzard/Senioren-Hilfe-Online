    quelle: https://faq.whatsapp.com/490592613091019/?locale=de_DE&cms_platform=android
    zitat: "Ohne dein Passwort, deinen Verschlüsselungsschlüssel oder deinen Passkey kannst du nicht auf dein verschlüsseltes Backup zugreifen."
  - aussage: "WhatsApp kann Passwort/Schlüssel weder senden noch zurücksetzen"
    quelle: https://faq.whatsapp.com/490592613091019/?locale=de_DE&cms_platform=android
