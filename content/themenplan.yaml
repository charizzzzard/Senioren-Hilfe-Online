# Themenplan für netzleicht.de
#
# Claude arbeitet diese Liste ab: höchste Priorität mit status "offen" – 0 kommt vor 1, 1 vor 2 usw.
# Bei gleicher Priorität: höheres Suchvolumen zuerst.
# prioritaet: 0 = Vorrang, den der Betreiber ausdrücklich festgelegt hat (z. B. eine Saison). Nur er vergibt sie.
# format: anleitung (Standard, content/artikel/) | lexikon (content/lexikon/, „Was ist …?“)
#         Aktuelle Themen sind Anleitungen mit kategorie: aktuell (Rubrik „Aktuell erklärt“).
# status: offen | in_arbeit | veroeffentlicht | zurueckgestellt
# monetarisierung: nein | spaeter_moeglich  (nur Hinweis für die Strategie – NICHT selbst aktivieren)
# wettbewerb: Kurzbefund der Google-Suche (Details und Datum: docs/WETTBEWERB.md)
#
# Suchdaten: OpenSEO (DataForSEO), Google Deutschland, Abruf 30.10.2026.
#   suchvolumen = geschätzte Suchanfragen pro Monat für das keyword
#   kd          = Keyword Difficulty 0–100 (Schätzung, wie schwer ein Top-10-Ranking ist)
#   null        = keine Daten verfügbar (nicht automatisch „0 Suchen“)
# Grundsatz aus den Daten: Ältere Menschen suchen die Aufgabe („screenshot iphone“),
# nicht „… für Senioren“. Deshalb Titel und keyword immer in Alltagssprache der Suche.

