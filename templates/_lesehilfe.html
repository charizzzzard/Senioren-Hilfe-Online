<div class="lesehilfe nicht-drucken" role="toolbar" aria-label="Lesehilfe" hidden>
  <span class="lesehilfe__titel">Lesehilfe</span>
  <span class="lesehilfe__gruppe">
    <button type="button" data-aktion="kleiner" aria-label="Schrift kleiner">A−</button>
    <button type="button" data-aktion="groesser" aria-label="Schrift größer">A+</button>
  </span>
  <button type="button" data-aktion="vorlesen" aria-pressed="false">▶ Vorlesen</button>
  <span class="lesehilfe__gruppe lesehilfe__geraet" hidden>
    <span class="lesehilfe__label">Mein Handy:</span>
    <button type="button" data-geraet="iphone" aria-pressed="false">iPhone</button>
    <button type="button" data-geraet="android" aria-pressed="false">Android</button>
    <button type="button" data-geraet="alle" aria-pressed="true">Beide</button>
  </span>
</div>
