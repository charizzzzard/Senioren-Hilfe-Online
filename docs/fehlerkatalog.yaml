# Fehlerkatalog von netzleicht.de – jede belegte Abweichung eines Textes von seinen Quellen.
# Regeln: docs/BETRIEB.md Abschnitt 9. Öffentlich: keine personenbezogenen Daten, Leserhinweise nur sinngemäß.
#
# Wozu: (1) aus Fehlern lernen (Ursachen), (2) Testfälle für die Prüfer-Eichung, (3) Qualitätsbremse in tools/check.py.
#
# Felder:
#   id              JJJJ-MM-TT-NN (Fundtag + laufende Nummer)
#   gefunden        Datum, an dem der Fehler festgestellt und eingetragen wurde (nie rückdatieren)
#   text            artikel/<slug> oder lexikon/<slug>
#   art             falsch | veraltet | widerspruch | unbelegt | luecke
#                     falsch      Aussage stimmt nicht (auch: zu absolut, Quelle nennt Ausnahme)
#                     veraltet    stimmte früher, Quelle sagt heute etwas anderes
#                     widerspruch Text widerspricht sich selbst (z. B. Checkliste gegen Fließtext)
#                     unbelegt    Aussage steht so nicht in der Quelle (kann trotzdem stimmen)
#                     luecke      Wichtiger Hinweis fehlte (z. B. nur Android-Weg, iPhone fehlt)
#   live            true, wenn der Fehler auf netzleicht.de veröffentlicht war; false, wenn ihn die Prüfung vorher fand
#   entdeckt_durch  faktenpruefung | nachpruefung (auch: beim Anlegen einer Belegtabelle) | belegcheck | stichprobe | leser |
#                   geraetetest | betreiber | inhaltspruefung
#   vorher          die fehlerhafte Stelle (gekürzt)
#   korrektur       was jetzt dort steht bzw. was geändert wurde
#   ursache         warum es passiert ist (Prozess, nicht Person)
#   behoben_in      PR-Nummer, z. B. "#15"
#   altbestand      true, wenn der Text vor dem 06.11.2026 erschienen ist und noch KEINE Belegtabelle hatte, als der
#                   Fehler gefunden wurde (typisch: die Nachprüfung legt die erste Tabelle an und findet ihn dabei).
#                   Solche Einträge zählen nicht für die Qualitätsbremse. tools/check.py verlangt das Feld in diesem
#                   Fall und lehnt es ab, wenn der Text schon eine Belegtabelle hatte oder jünger ist.
#
# Qualitätsbremse (tools/check.py): zählt Einträge mit live: true, art falsch | veraltet | widerspruch
# und gefunden ab dem Stichtag 06.11.2026 – ohne altbestand: true. Die Einträge vom 05.11.2026 sind der
# Ausgangsbestand vor Einführung der Belegtabellen und zählen nicht für die Bremse.

