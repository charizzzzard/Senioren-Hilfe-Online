# Konfigurationsentwurf. Keine produktiven Aufgaben aktivieren, bevor Phase 0 abgeschlossen ist.
schema_version: 1
repository: charizzzzard/Senioren-Hilfe-Online
website: https://netzleicht.de
scheduler_owner: unset  # erst auf claude_self_hosted ODER systemd setzen
mode: dry_run
timezone: Europe/Berlin
concurrency: 1

limits:
  publication_rules_source: docs/BETRIEB.md
  publication_rules_checker: tools/check.py
  review_prs_per_run: 4
  model_monthly_usd: null
  model_per_run_usd: null
  seo_monthly_credits: null
  device_monthly_minutes: null
  device_session_max_minutes: null
  # null = nicht für kostenpflichtige Ausführung eingerichtet; kein unbegrenztes Budget

jobs:
  - id: neuer-artikel
    schedule: '37 10 * * 2,5'
    role: author
    model_family_current: opus
    prompt: docs/aufgaben/neuer-artikel.txt
    catch_up: latest_only_if_still_relevant
  - id: die-woche-im-netz
    schedule: '43 7 * * 5'
    role: author
    model_family_current: opus
    prompt: docs/aufgaben/die-woche-im-netz.txt
    catch_up: do_not_publish_stale_issue
  - id: faktenpruefung
    schedule: '23 13 * * 2,5'
    role: reviewer
    model_family_current: opus
    prompt: docs/aufgaben/faktenpruefung.txt
    catch_up: latest_only
  - id: nachpruefung
    schedule: '7 20 * * 1,3'
    role: author
    model_family_current: opus
    prompt: docs/aufgaben/nachpruefung.txt
    monday_condition: legacy_texts_without_evidence_exist
    catch_up: latest_only
  - id: freigabe
    schedule: '12 19 * * *'
    role: release
    model_family_current: sonnet
    prompt: docs/aufgaben/freigabe.txt
    catch_up: latest_only_after_reconciliation
  - id: wochenbericht
    schedule: '13 8 * * 1'
    role: reporter
    model_family_current: opus
    prompt: docs/aufgaben/wochenbericht.txt
    catch_up: upsert_missing_reporting_periods
  - id: monatliche-wartung
    schedule: '32 13 3 * *'
    role: author
    model_family_current: opus
    prompt: docs/aufgaben/monatliche-wartung.txt
    catch_up: latest_only

existing_external_jobs:
  - id: weekly-github-maintenance
    owner: github_actions
    schedule: '17 5 * * 1'
    timezone: UTC
    workflow: .github/workflows/wartung.yml
    duplicate_on_vps: false

deterministic_services:
  monitor_interval_seconds: 300
  encrypted_backup_daily: true
  device_cleanup_required: true
  # Diese Dienste sind im gewählten Betriebsweg erst zu implementieren.
