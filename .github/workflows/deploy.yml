name: Bauen, prüfen, veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2 # im Pull Request ist HEAD der Merge-Commit und HEAD^1 der Stand von main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      # Kontingent (Regel 9) und Qualitätsbremse halten NEUE Texte auf: im Pull Request alles, was es auf main noch
      # nicht gibt (Vergleichsstand HEAD^1). Auf main selbst ist nichts neu (Vergleichsstand HEAD) – ein schon
      # veröffentlichter Text kann den Deploy und damit die Korrekturen nie blockieren (tools/check.py).
      - name: Seite bauen und Qualität prüfen
        env:
          NETZLEICHT_BASIS: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
        run: python tools/check.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Playwright installieren (für die Checklisten-PDFs)
        run: npm ci

      - name: Chromium aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      # Eine Checkliste mit mehr als einer A4-Seite ist im Pull Request ein Fehler, auf main nur ein Hinweis.
      - name: Checklisten-PDFs erzeugen
        run: node tools/pdf.mjs _site ${{ github.event_name != 'pull_request' && '--nur-hinweis' || '' }}

      - name: Pages konfigurieren
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Pages-Paket hochladen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_2.outputs.page_url }}
    steps:
      # Lehnt GitHub Pages den Deploy ab („Deployment failed, try again later“), folgt nach einer Minute
      # genau ein zweiter Versuch. Anlass: docs/stoerungen/2026-11-06-deploy-pages.md
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Eine Minute warten (erster Versuch gescheitert)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Auf GitHub Pages veröffentlichen (zweiter Versuch)
        id: deployment_2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Live-Seite prüfen
        run: |
          python tools/build.py
          python tools/livecheck.py --versuche 6 --pause 10

      - name: Suchmaschinen per IndexNow informieren
        run: python tools/indexnow.py "${{ github.event.before }}" "${{ github.sha }}"
