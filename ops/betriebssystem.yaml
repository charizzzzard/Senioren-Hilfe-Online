# Vorschlag zur Weiterentwicklung. Kein Zeitplan und keine Änderung aktiver Aufträge.
schema_version: 1
mode: proposal
mission: Digitale Alltagsaufgaben selbstständig und sicher bewältigen.
policy_source: docs/BETRIEB.md
publication_checker: tools/check.py
wip_limit: 1  # zusätzliche strategische Vorhaben; bestehender Redaktionsbetrieb bleibt separat
pr_snapshot_max_age_hours: 48
tasks:
  - id: SYS-001
    title: Gesamtbetrieb gemeinsam mit Claude gegenprüfen
    area: operations
    priority: 0
    state: in_review
    owner: betrieb
    depends_on: []
    metric: docs/betrieb/CLAUDE-DIALOG.md
    acceptance:
      - Aktive Aufträge und Repository-Abweichungen sind abgeglichen.
      - Jeder Einwand ist beantwortet oder als offener Punkt dokumentiert.
      - Ein Betriebsweg und ein nächstes Vorhaben sind benannt.
  - id: QUA-001
    title: Altbestand und laufende Nachbesserungen abschließen
    area: quality
    priority: 0
    state: proposed
    owner: redaktion
    depends_on: []
    metric: content/belege und offene Prüf-PRs
    acceptance:
      - Fehlende Tabellen und offene Befunde sind einzeln nachvollziehbar.
      - Quellenprüfung, Gerätebefund und Verständlichkeit bleiben unterscheidbar.
      - Abschluss erfolgt nach unabhängig geprüften Änderungen, nicht durch Statuspflege.
  - id: OPS-001
    title: Vorhandene Aufgaben auf einem eindeutigen Betriebsweg absichern
    area: operations
    priority: 1
    state: proposed
    owner: betrieb
    depends_on: [SYS-001]
    metric: docs/vps/UMSETZUNGSPLAN-FUER-CLAUDE.md
    acceptance:
      - Nach Neustart entstehen keine doppelten fachlichen Vorgänge.
      - Kostenrahmen, Rechte, Überwachung und Rückweg sind geprüft.
      - Genau eine Zeitplanquelle besitzt jeden redaktionellen Auftrag.
  - id: DEV-001
    title: Schrift-Anleitung auf einem echten Cloud-Samsung prüfen
    area: quality
    priority: 1
    state: proposed
    owner: geraetepruefung
    depends_on: [SYS-001]
    metric: privater Gerätebeleg und geprüfter Korrektur-PR
    acceptance:
      - Anbieter, Zugang, Minutenrahmen und Bereinigung sind eingerichtet.
      - Gerät, Version, Sprache, Datum und Text-SHA sind dokumentiert.
      - Sichtbare Schritte, Sollzustand und Rückweg sind einzeln geprüft.
      - Nach Abbruch bleibt keine unkontrollierte Sitzung bestehen.
  - id: UX-001
    title: Einen vollständigen Nutzerweg messbar verbessern
    area: product
    priority: 2
    state: proposed
    owner: produkt
    depends_on: [QUA-001]
    metric: Vorher-Nachher-Test des Wegs zur Schrift-Anleitung
    acceptance:
      - Finden, Gerätewahl, Ausführung und Rückweg funktionieren mobil und mit Tastatur.
      - Zoom, reduzierte Bewegung, Vorlesen und Druckansicht bleiben nutzbar.
      - Menschliche Rückmeldungen werden erst nach einem echten Test ausgewiesen.
  - id: SEO-001
    title: Bestehende Seiten nach vollständiger Suchabsicht verbessern
    area: acquisition
    priority: 2
    state: proposed
    owner: redaktion
    depends_on: [QUA-001]
    metric: kennzahlen und begründete Seiten-Briefings
    acceptance:
      - Suchdaten, Zeitraum und ursprünglicher Abruf sind benannt.
      - Vorhandene Seiten und PRs sind auf Überschneidungen geprüft.
      - Erfolgskontrolle verwendet passende Zeitfenster und keine Rankinggarantie.
  - id: DIS-001
    title: Kursmaterial und einen betreuten Verbreitungspilot vorbereiten
    area: distribution
    priority: 2
    state: proposed
    owner: betreiber
    depends_on: [QUA-001]
    metric: bestehendes Issue 26 und dokumentierte Rückmeldungen
    acceptance:
      - Bestehende Schwelle und Entscheidung zur Materialseite sind erfüllt.
      - Material ist datiert, druckbar und sein Weitergabehinweis abgestimmt.
      - Drei bis fünf Einrichtungen sind als Pilotvorschlag benannt.
      - Nur tatsächlich erfolgte Kontakte, Nutzung und Empfehlungen werden gezählt.
  - id: COM-001
    title: Kleine Testleser-Runde mit wiederkehrender Rückkopplung vorbereiten
    area: community
    priority: 3
    state: proposed
    owner: betreiber
    depends_on: [QUA-001, UX-001]
    metric: anonymisierte Beobachtungen und daraus geschlossene Verbesserungen
    acceptance:
      - Teilnahme, Zeitrahmen und Betreuung sind geklärt.
      - Aufgabenabschluss und benötigte Hilfe werden getrennt dokumentiert.
      - Keine personenbezogenen Rohdaten werden öffentlich abgelegt.
      - Lesergruppe und tatsächliche Stichprobengröße sind angegeben.
